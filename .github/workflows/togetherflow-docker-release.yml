name: Release TogetherFlow Docker Images

# Manual, like the engine's own image release. Builds the TogetherFlow app images,
# pushes them, and signs them with the same cosign key and pattern already used by
# .github/workflows/docker-release.yml (REQUIREMENTS.md §13.1, §13.3).
#
# Every app is released together rather than one at a time: §13.1 requires signed
# images for every module, and a release flow that covers one of four is how an
# unsigned exception gets introduced by accident.
on:
  workflow_dispatch:
    inputs:
      tag_latest:
        description: "Also tag and sign as :latest"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: "temurin"
          java-version: "21"

      # The image version tracks the engine version (docs/ui/VERSIONING.md), so it is
      # read from the reactor rather than maintained separately. Resolved once and
      # shared, so a matrix of four builds cannot disagree about what it is releasing.
      - name: Resolve project version
        id: meta
        run: echo "version=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)" >> "$GITHUB_OUTPUT"

  release:
    name: Build, push and sign ${{ matrix.app }}
    needs: version
    runs-on: ubuntu-latest
    strategy:
      # Not fail-fast: a failure building one app should not leave the others
      # half-released with no record of why.
      fail-fast: false
      matrix:
        app: [work, control, identity, design]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push togetherflow-${{ matrix.app }}
        id: build
        uses: docker/build-push-action@v6
        with:
          # Context is modules/ so the image can see togetherflow-common, which every
          # app consumes through an npm file: dependency.
          context: modules
          file: modules/togetherflow-${{ matrix.app }}/docker/Dockerfile
          push: true
          provenance: true
          sbom: true
          tags: |
            flowable/togetherflow-${{ matrix.app }}:${{ needs.version.outputs.version }}
            ${{ inputs.tag_latest && format('flowable/togetherflow-{0}:latest', matrix.app) || '' }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0

      - name: Write signing key to disk
        run: echo "${{ secrets.SIGNING_SECRET }}" > cosign.key

      # Signing the digest rather than the tag: a tag can be moved to point at
      # different content, a digest cannot, so this is what actually binds the
      # signature to the bits that were built.
      - name: Sign the published image
        env:
          COSIGN_PASSWORD: ""
        run: |
          cosign sign --key cosign.key \
            -a "repo=${{ github.repository }}" \
            -a "ref=${{ github.sha }}" \
            flowable/togetherflow-${{ matrix.app }}@${{ steps.build.outputs.digest }} \
            -y

      - name: Remove signing key
        if: always()
        run: rm -f cosign.key

      - name: Verify the signature
        run: |
          cosign verify --key docker/cosign.pub \
            flowable/togetherflow-${{ matrix.app }}@${{ steps.build.outputs.digest }}

  services:
    # The Java side of TogetherFlow: optional services, each shipped as its own image.
    # A matrix rather than a job apiece — they differ only by module name, and two copies
    # of sixty lines is how one of them quietly stops being signed.
    name: Build, push and sign ${{ matrix.service }}
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - togetherflow-attachment-gateway
          - togetherflow-workspace
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: "temurin"
          java-version: "21"
          cache: maven

      # These are Spring Boot jars, not frontend builds, so the image is built from an
      # artifact the reactor produces rather than inside the Dockerfile.
      - name: Build the jar
        run: ./mvnw -B -ntp -Ptogetherflow -pl modules/${{ matrix.service }} -am package -DskipTests

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push ${{ matrix.service }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: modules/${{ matrix.service }}
          file: modules/${{ matrix.service }}/docker/Dockerfile
          push: true
          provenance: true
          sbom: true
          tags: |
            flowable/${{ matrix.service }}:${{ needs.version.outputs.version }}
            ${{ inputs.tag_latest && format('flowable/{0}:latest', matrix.service) || '' }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0

      - name: Write signing key to disk
        run: echo "${{ secrets.SIGNING_SECRET }}" > cosign.key

      - name: Sign the published image
        env:
          COSIGN_PASSWORD: ""
        run: |
          cosign sign --key cosign.key \
            -a "repo=${{ github.repository }}" \
            -a "ref=${{ github.sha }}" \
            flowable/${{ matrix.service }}@${{ steps.build.outputs.digest }} \
            -y

      - name: Remove signing key
        if: always()
        run: rm -f cosign.key

      - name: Verify the signature
        run: |
          cosign verify --key docker/cosign.pub \
            flowable/${{ matrix.service }}@${{ steps.build.outputs.digest }}
