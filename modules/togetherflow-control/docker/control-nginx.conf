server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # A strict CSP matters here because the app renders content that originated in
    # deployed process models (REQUIREMENTS.md §13.1). connect-src stays broad enough
    # to reach the REST API and identity provider, which are deployment-specific.
    include /etc/nginx/conf.d/security-headers.conf;

    # Generated at container start; never cache it, or the app picks up stale
    # configuration after a redeploy.
    location = /config.js {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Fingerprinted assets are immutable.
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # SPA routing: unknown paths render the app rather than 404.
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
