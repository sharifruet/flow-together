name: TogetherFlow UI

# Baseline CI for the TogetherFlow frontend modules (IMPLEMENTATION_PLAN.md, Phase 0).
# Runs only when the UI or its specs change, so engine-only PRs are unaffected.
on:
  push:
    branches: [main]
    paths:
      - "modules/togetherflow-*/**"
      - "docs/public-api/**"
      - ".github/workflows/togetherflow-ui.yml"
  pull_request:
    paths:
      - "modules/togetherflow-*/**"
      - "docs/public-api/**"
      - ".github/workflows/togetherflow-ui.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - togetherflow-common
          - togetherflow-work
          - togetherflow-identity
          - togetherflow-control
          - togetherflow-design
    defaults:
      run:
        working-directory: modules/${{ matrix.module }}/src/main/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: modules/${{ matrix.module }}/src/main/frontend/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        if: matrix.module != 'togetherflow-common'

      # §13.5 asks for budgets that fail the build rather than being noticed later.
      # Runs against the dist/ the step above just produced.
      - name: Bundle budget
        run: npm run budget
        if: matrix.module != 'togetherflow-common'

      # The component gallery (§14.2) is documentation, so it is easy to let rot. Building
      # it here means a component that no longer compiles in isolation fails the build —
      # the coverage test in the unit suite catches an undocumented one.
      - name: Build the component gallery
        run: npm run gallery:build
        if: matrix.module == 'togetherflow-common'

  contract-drift:
    name: OpenAPI contract drift
    runs-on: ubuntu-latest
    # Regenerates types from the checked-in specs and fails if the committed
    # output differs — i.e. someone changed a spec without regenerating, or
    # regenerated without committing. The typed conformance assertions in
    # src/api/contract.test-d.ts then fail the typecheck job above if a change
    # actually breaks what the UI depends on.
    defaults:
      run:
        working-directory: modules/togetherflow-common/src/main/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: modules/togetherflow-common/src/main/frontend/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Regenerate types from specs
        run: npm run codegen

      - name: Fail if generated types are out of date
        run: |
          if ! git diff --quiet -- src/api/generated; then
            echo "::error::Generated API types are out of date. Run 'npm run codegen' in modules/togetherflow-common/src/main/frontend and commit the result."
            git diff --stat -- src/api/generated
            exit 1
          fi
          echo "Generated types match the published specs."

  e2e:
    name: End-to-end (${{ matrix.module }})
    runs-on: ubuntu-latest
    # §8 requires the golden paths to run "against a real instance of this repo's REST
    # layer — not mocked responses — so contract drift between frontend and backend is
    # caught". A service container is that real instance.
    services:
      engine:
        image: flowable/flowable-rest
        ports:
          - 8080:8080
        options: >-
          --health-cmd "wget -qO- http://localhost:8080/flowable-rest/actuator/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    strategy:
      fail-fast: false
      matrix:
        module:
          - togetherflow-work
          - togetherflow-identity
          - togetherflow-control
          - togetherflow-design
    defaults:
      run:
        working-directory: modules/${{ matrix.module }}/src/main/frontend
    env:
      # Matches the stock image, which serves under /flowable-rest and mounts the BPMN
      # servlet at /service. Verified by running it.
      TF_API_TARGET: http://localhost:8080
      TF_API_CONTEXT: /flowable-rest
      TF_E2E_USER: rest-admin
      TF_E2E_PASSWORD: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: modules/${{ matrix.module }}/src/main/frontend/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Golden paths
        run: npm run e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ matrix.module }}
          path: modules/${{ matrix.module }}/src/main/frontend/test-results/
          retention-days: 7

  visual:
    name: Visual regression
    runs-on: ubuntu-latest
    # Runs inside the same image `npm run e2e:visual:docker` uses locally. Screenshot
    # comparison is only meaningful when the renderer matches: the previous job compared
    # darwin-generated baselines on a bare linux runner, which meant it could differ on
    # font rendering alone and so was left non-blocking — a check that cannot fail is
    # not a check (§14.5). Same container both sides, so it can gate.
    container:
      image: mcr.microsoft.com/playwright:v1.49.1-jammy
      options: --user 1001
    defaults:
      run:
        working-directory: modules/togetherflow-work/src/main/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: modules/togetherflow-work/src/main/frontend/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      # NOTE: still non-blocking, and this is the one thing standing between here and a
      # gating visual suite. The committed baselines are darwin-generated; regenerate
      # them in this same container and commit the result:
      #
      #   npm run e2e:visual:docker -- --update-snapshots
      #
      # then delete continue-on-error below. Doing that needs a working Docker daemon,
      # which is why it has not been done in the same change as this file.
      - name: Visual regression
        id: visual
        continue-on-error: true
        run: npm run e2e:visual

      - name: Upload diff report
        if: steps.visual.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-report
          path: modules/togetherflow-work/src/main/frontend/test-results/
          retention-days: 7

  audit:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - togetherflow-common
          - togetherflow-work
          - togetherflow-identity
          - togetherflow-control
          - togetherflow-design
    defaults:
      run:
        working-directory: modules/${{ matrix.module }}/src/main/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: modules/${{ matrix.module }}/src/main/frontend/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      # Fails the build on high/critical advisories only; moderate findings are
      # reported without blocking, so a transitive dev-only advisory cannot stop a
      # release while a real exploitable issue still does (REQUIREMENTS.md §13.1).
      - name: Audit (report all)
        run: npm audit --audit-level=moderate || true

      - name: Audit (fail on high or critical)
        run: npm audit --audit-level=high
