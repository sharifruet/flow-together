name: TogetherFlow UI

# Baseline CI for the TogetherFlow frontend modules (IMPLEMENTATION_PLAN.md, Phase 0).
# Runs only when the UI or its specs change, so engine-only PRs are unaffected.
on:
  push:
    branches: [main]
    paths:
      - "modules/togetherflow-*/**"
      - "docs/public-api/**"
      - "k8s/**"
      # Checkstyle's import-control.xml lives here and decides whether the Java modules
      # below pass. A regression in it should fail a PR, not surface months later.
      - "build-tools/**"
      - ".github/workflows/togetherflow-ui.yml"
  pull_request:
    paths:
      - "modules/togetherflow-*/**"
      - "docs/public-api/**"
      - "k8s/**"
      - "build-tools/**"
      - ".github/workflows/togetherflow-ui.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - togetherflow-common
          - togetherflow-work
          - togetherflow-identity
          - togetherflow-control
          - togetherflow-design
    defaults:
      run:
        working-directory: modules/${{ matrix.module }}/src/main/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: modules/${{ matrix.module }}/src/main/frontend/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      # The apps consume togetherflow-common as an npm `file:` dependency, which npm
      # installs as a symlink to the source tree. TypeScript resolves that symlink to its
      # real path, so imports *inside* common resolve against common's own node_modules
      # rather than the app's — `npm ci` above does not reach them. Without this, an app's
      # typecheck and build fail on common's test helpers (axe-core, reached through
      # `@togetherflow/common/testing/a11y`).
      - name: Install togetherflow-common dependencies
        if: matrix.module != 'togetherflow-common'
        working-directory: modules/togetherflow-common/src/main/frontend
        run: npm ci --no-audit --no-fund

      # Design's CMMN schema test runs the real CMMN 1.1 XSD over the XML its serialiser
      # produces. It fails rather than skips when xmllint is missing, so the tool has to be
      # here — a check that quietly does not run is what let four schema bugs reach a deploy.
      - name: Install xmllint
        if: matrix.module == 'togetherflow-design'
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        if: matrix.module != 'togetherflow-common'

      # §13.5 asks for budgets that fail the build rather than being noticed later.
      # Runs against the dist/ the step above just produced.
      - name: Bundle budget
        run: npm run budget
        if: matrix.module != 'togetherflow-common'

      # The component gallery (§14.2) is documentation, so it is easy to let rot. Building
      # it here means a component that no longer compiles in isolation fails the build —
      # the coverage test in the unit suite catches an undocumented one.
      - name: Build the component gallery
        run: npm run gallery:build
        if: matrix.module == 'togetherflow-common'

  contract-drift:
    name: OpenAPI contract drift
    runs-on: ubuntu-latest
    # Regenerates types from the checked-in specs and fails if the committed
    # output differs — i.e. someone changed a spec without regenerating, or
    # regenerated without committing. The typed conformance assertions in
    # src/api/contract.test-d.ts then fail the typecheck job above if a change
    # actually breaks what the UI depends on.
    defaults:
      run:
        working-directory: modules/togetherflow-common/src/main/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: modules/togetherflow-common/src/main/frontend/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Regenerate types from specs
        run: npm run codegen

      - name: Fail if generated types are out of date
        run: |
          if ! git diff --quiet -- src/api/generated; then
            echo "::error::Generated API types are out of date. Run 'npm run codegen' in modules/togetherflow-common/src/main/frontend and commit the result."
            git diff --stat -- src/api/generated
            exit 1
          fi
          echo "Generated types match the published specs."

  e2e:
    name: End-to-end (${{ matrix.module }})
    runs-on: ubuntu-latest
    # §8 requires the golden paths to run "against a real instance of this repo's REST
    # layer — not mocked responses — so contract drift between frontend and backend is
    # caught". A service container is that real instance.
    services:
      engine:
        image: flowable/flowable-rest
        ports:
          - 8080:8080
        options: >-
          --health-cmd "wget -qO- http://localhost:8080/flowable-rest/actuator/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    strategy:
      fail-fast: false
      matrix:
        module:
          - togetherflow-work
          - togetherflow-identity
          - togetherflow-control
          - togetherflow-design
    defaults:
      run:
        working-directory: modules/${{ matrix.module }}/src/main/frontend
    env:
      # Matches the stock image, which serves under /flowable-rest and mounts the BPMN
      # servlet at /service. Verified by running it.
      TF_API_TARGET: http://localhost:8080
      TF_API_CONTEXT: /flowable-rest
      TF_E2E_USER: rest-admin
      TF_E2E_PASSWORD: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: modules/${{ matrix.module }}/src/main/frontend/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      # The apps consume togetherflow-common as an npm `file:` dependency, which npm
      # installs as a symlink to the source tree. TypeScript resolves that symlink to its
      # real path, so imports *inside* common resolve against common's own node_modules
      # rather than the app's — `npm ci` above does not reach them. Without this, an app's
      # typecheck and build fail on common's test helpers (axe-core, reached through
      # `@togetherflow/common/testing/a11y`).
      - name: Install togetherflow-common dependencies
        working-directory: modules/togetherflow-common/src/main/frontend
        run: npm ci --no-audit --no-fund

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Golden paths
        run: npm run e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ matrix.module }}
          path: modules/${{ matrix.module }}/src/main/frontend/test-results/
          retention-days: 7

  visual:
    name: Visual regression (${{ matrix.module }})
    runs-on: ubuntu-latest
    # Runs inside the same image `npm run e2e:visual:docker` uses locally. Screenshot
    # comparison is only meaningful when the renderer matches: an earlier version of this
    # job compared darwin-generated baselines on a bare linux runner, which meant it could
    # differ on font rendering alone and so was left non-blocking — a check that cannot
    # fail is not a check (§14.5). Same container both sides, so it can gate.
    #
    # All four apps as of W1.5 (UI_POLISH_BACKLOG.md G1): covering one app meant a
    # restyle of the shared shell could only be caught in Work.
    strategy:
      fail-fast: false
      matrix:
        module:
          - togetherflow-work
          - togetherflow-control
          - togetherflow-identity
          - togetherflow-design
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-jammy
      options: --user 1001
    defaults:
      run:
        working-directory: modules/${{ matrix.module }}/src/main/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: modules/${{ matrix.module }}/src/main/frontend/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      # The apps consume togetherflow-common as an npm `file:` dependency, which npm
      # installs as a symlink to the source tree. TypeScript resolves that symlink to its
      # real path, so imports *inside* common resolve against common's own node_modules
      # rather than the app's — `npm ci` above does not reach them. Without this, an app's
      # typecheck and build fail on common's test helpers (axe-core, reached through
      # `@togetherflow/common/testing/a11y`).
      - name: Install togetherflow-common dependencies
        working-directory: modules/togetherflow-common/src/main/frontend
        run: npm ci --no-audit --no-fund

      # NOTE: still non-blocking, and this is the one thing standing between here and a
      # gating visual suite. No `*-linux.png` baselines are committed for any app, so
      # every run currently reports "missing snapshot" rather than a real comparison.
      # Generate them in this same container and commit the result:
      #
      #   npm run e2e:visual:docker -- --update-snapshots
      #
      # then delete continue-on-error below. Doing that needs a working Docker daemon,
      # which is why it has not been done in the same change as this file.
      - name: Visual regression
        id: visual
        continue-on-error: true
        run: npm run e2e:visual

      - name: Upload diff report
        if: steps.visual.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-report-${{ matrix.module }}
          path: modules/${{ matrix.module }}/src/main/frontend/test-results/
          retention-days: 7

  java:
    name: Java modules
    runs-on: ubuntu-latest
    # The two TogetherFlow Java modules — the optional attachment gateway and the optional
    # event recorder. Neither was covered by anything: the verify matrix above is
    # frontend-only, and togetherflow-docker-release.yml only ever runs `package
    # -DskipTests`. Their tests and their checkstyle therefore ran on nobody's machine.
    steps:
      - uses: actions/checkout@v4

      # 21 rather than the reactor's compile target of 17, matching
      # togetherflow-docker-release.yml — these jars ship on a 21 JRE, so that is the
      # runtime worth testing them on.
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: "temurin"
          java-version: "21"
          cache: maven

      # Two steps rather than one `-am verify`: `-am` pulls in reactor dependencies
      # (flowable-event-registry-api and friends), and running `verify` across those would
      # execute the engine's own test suites, which is not what this job is for. Build the
      # dependencies without tests, then verify only the two modules. `-am` also brings in
      # build-tools, which is where the checkstyle configuration comes from.
      - name: Build dependencies
        run: >-
          ./mvnw -B -ntp -Ptogetherflow
          -pl modules/togetherflow-attachment-gateway,modules/togetherflow-event-recorder
          -am install -Dmaven.test.skip=true

      # `verify`, not `test`: checkstyle is bound to verify, so `test` would leave it
      # unrun — which is exactly how these modules went unchecked in the first place.
      - name: Test and checkstyle
        run: >-
          ./mvnw -B -ntp -Ptogetherflow
          -pl modules/togetherflow-attachment-gateway,modules/togetherflow-event-recorder
          verify

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: java-surefire-reports
          path: modules/togetherflow-*/target/surefire-reports/
          retention-days: 7

  manifests:
    name: Helm chart and manifests
    runs-on: ubuntu-latest
    # The chart and the plain manifests in k8s/resources describe the same deployment and
    # are maintained side by side, so both are checked here. Schema validation needs no
    # cluster; it catches the typo-in-a-field class of breakage that only shows up at
    # apply time otherwise. It does not prove scheduling, volumes or probes.
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Lint the chart
        run: helm lint k8s/flowable/togetherflow

      - name: Install kubeconform
        run: |
          curl -sSLo kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/

      - name: Validate the plain manifests
        run: kubeconform -strict -summary -kubernetes-version 1.30.0 k8s/resources

      # Rendered twice: defaults, and everything switched on. A conditional template that
      # only breaks when its feature is enabled is exactly what a defaults-only render
      # misses.
      - name: Validate the chart with defaults
        run: |
          helm template tf k8s/flowable/togetherflow \
            --set auth.oidc.authority=https://idp.example.com \
            | kubeconform -strict -summary -kubernetes-version 1.30.0 -

      - name: Validate the chart with every option enabled
        run: |
          helm template tf k8s/flowable/togetherflow \
            --set auth.oidc.authority=https://idp.example.com \
            --set attachmentGateway.enabled=true \
            --set attachmentGateway.filesystem.publicBaseUrl=https://files.example.com \
            --set ingress.enabled=true \
            --set ingress.hosts.work=work.example.com \
            --set ingress.hosts.control=control.example.com \
            --set ingress.hosts.identity=identity.example.com \
            --set ingress.hosts.design=design.example.com \
            --set ingress.hosts.attachmentGateway=files.example.com \
            --set serviceAccount.create=true \
            --set networkPolicy.enabled=true \
            | kubeconform -strict -summary -kubernetes-version 1.30.0 -

  audit:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - togetherflow-common
          - togetherflow-work
          - togetherflow-identity
          - togetherflow-control
          - togetherflow-design
    defaults:
      run:
        working-directory: modules/${{ matrix.module }}/src/main/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: modules/${{ matrix.module }}/src/main/frontend/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      # Fails the build on high/critical advisories only; moderate findings are
      # reported without blocking, so a transitive dev-only advisory cannot stop a
      # release while a real exploitable issue still does (REQUIREMENTS.md §13.1).
      - name: Audit (report all)
        run: npm audit --audit-level=moderate || true

      - name: Audit (fail on high or critical)
        run: npm audit --audit-level=high
