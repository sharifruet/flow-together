{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "togetherflow.serviceAccountName" . }}
  labels:
    {{- include "togetherflow.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# None of these workloads talks to the Kubernetes API. The pods also set
# automountServiceAccountToken: false, so this is belt and braces.
automountServiceAccountToken: false
{{- end }}
