# Publish every task attachment to the attachment gateway.
# The gateway's default provider is a local SharePoint library at http://localhost:8091/sharepoint.
# Set togetherflow.attachments.sharepoint.mode=graph on the gateway, with Azure app
# credentials, to write the same files to a Microsoft 365 document library.
togetherflow.attachments.sharepoint.enabled=true
togetherflow.attachments.sharepoint.gateway-url=http://localhost:8091
togetherflow.attachments.sharepoint.required=true
