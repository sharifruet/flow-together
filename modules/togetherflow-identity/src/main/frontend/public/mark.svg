<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="TogetherFlow">
  <title>TogetherFlow</title>
  <!--
    The TogetherFlow icon mark, cropped tight and with no wordmark.

    REQUIREMENTS.md §7.5 asks for a vector source and a standalone mark for small
    sizes, because the checked-in logo.png is a 677x369 raster lockup whose wordmark is
    illegible at favicon size. This is that mark: the same geometry the Brand component
    draws inline, as a standalone file so the favicon and any external use share one
    source. Colours are literal here rather than CSS variables, since a favicon is
    rendered outside the page and inherits nothing.

    It remains a faithful reconstruction, not the brand owner's own artwork — replace
    it if and when they supply the original vector.
  -->
  <rect width="64" height="64" rx="12" fill="#ffffff"/>
  <!-- Cloud outline -->
  <path
    d="M16 42c-6 0-10-4.2-10-9.6 0-4.9 3.4-8.9 8-9.5C15.2 16.3 21 11 28 11c6.5 0 12 4.5 13.6 10.6.9-.3 1.9-.5 2.9-.5 5.2 0 9.5 4.3 9.5 9.6S49.7 42 44.5 42"
    fill="none" stroke="#17a2a2" stroke-width="3.2" stroke-linecap="round"/>
  <!-- Workflow glyph: start, task, gateway -->
  <circle cx="19" cy="30" r="3" fill="#4f9c3a"/>
  <rect x="26" y="26" width="9" height="8" rx="1.6" fill="#1f4e79"/>
  <path d="M39.5 30l3.2-3.2 3.2 3.2-3.2 3.2z" fill="#d99a1e"/>
  <!-- Three figures -->
  <g fill="#1f3a5f">
    <circle cx="22" cy="48" r="3.4"/>
    <path d="M16.4 58c0-3.1 2.5-5.6 5.6-5.6s5.6 2.5 5.6 5.6z"/>
    <circle cx="32" cy="46.5" r="3.8"/>
    <path d="M25.8 58c0-3.4 2.8-6.2 6.2-6.2s6.2 2.8 6.2 6.2z"/>
    <circle cx="42" cy="48" r="3.4"/>
    <path d="M36.4 58c0-3.1 2.5-5.6 5.6-5.6s5.6 2.5 5.6 5.6z"/>
  </g>
</svg>
