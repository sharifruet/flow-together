#server.port=8086
server.servlet.context-path=/flowable-rest
# Expose all actuator endpoints to the web
# They are exposed, but only authenticated users can see /info and /health abd users with access-admin can see the others
management.endpoints.web.exposure.include=*
# Full health details should only be displayed when a user is authorized
management.endpoint.health.show-details=when_authorized
# Only users with role access-admin can access full health details
management.endpoint.health.roles=access-admin
# Spring prefixes the roles with ROLE_. However, Flowable does not have that concept yet, so we need to override that with an empty string
flowable.rest.app.role-prefix=
spring.application.name=flowable-rest
spring.banner.location=classpath:/org/flowable/spring/boot/flowable-banner.txt
# The default domain for generating ObjectNames must be specified. Otherwise when multiple Spring Boot applications start in the same servlet container
# all would be created with the same name (com.zaxxer.hikari:name=dataSource,type=HikariDataSource) for example
spring.jmx.default-domain=${spring.application.name}
# datasource
#spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:~/flowable-db/ossdb;AUTO_SERVER=TRUE;AUTO_SERVER_PORT=9091;DB_CLOSE_DELAY=-1
spring.datasource.username=flowable
spring.datasource.password=flowable

spring.datasource.hikari.poolName=${spring.application.name}
# 10 minutes
spring.datasource.hikari.maxLifetime=600000
# 5 minutes
spring.datasource.hikari.idleTimeout=300000
spring.datasource.hikari.minimumIdle=10
spring.datasource.hikari.maximumPoolSize=50
# test query for H2, MySQL, PostgreSQL and Microsoft SQL Server
#spring.datasource.hikari.connection-test-query=select 1
# test query for Oracle
#spring.datasource.hikari.connection-test-query=SELECT 1 FROM DUAL
# test query for DB2
#spring.datasource.hikari.connection-test-query=SELECT current date FROM sysibm.sysdummy1

spring.datasource.type=com.zaxxer.hikari.HikariDataSource

# Deploys demo process definitions that allows to have some example data when using the REST API's
flowable.rest.app.create-demo-definitions=true

# engine properties
flowable.process.servlet.path=/service
flowable.database-schema-update=true
flowable.async-executor-activate=true
flowable.history-level=full

# Forms: validate submissions on the engine (FORM_REQUIREMENTS.md FR-S.3). Flowable's default is off,
# which lets a raw REST call bypass the rules the form declares.
flowable.form-field-validation-enabled=true

# mail server (BPMN mail service tasks and CMMN mail tasks read the same flowable.mail.server.* block)
# Port 465 is implicit TLS (SMTPS), so use-ssl=true and the port goes in ssl-port — FlowableMailClientCreator
# reads ssl-port only when use-ssl is set, and plain `port` only when it is not. use-tls is STARTTLS on 587
# and must stay off here; setting both makes the client negotiate STARTTLS inside an already-encrypted socket.
flowable.mail.server.host=mail.i2gether.com
flowable.mail.server.password=
flowable.mail.server.ssl-port=465
flowable.mail.server.use-ssl=true
flowable.mail.server.use-tls=false
flowable.mail.server.username=together-flow@i2gether.com
flowable.mail.server.default-from=together-flow@i2gether.com
# The password is a secret and is deliberately NOT set here: this file is in git and ships inside the war.
# Supply it at runtime with the FLOWABLE_MAIL_SERVER_PASSWORD environment variable (or a
# -Dflowable.mail.server.password=... system property). This file is loaded with addLast, i.e. at the
# lowest precedence, so anything set in the environment wins over it. See docs/ui/OPERATIONS.md section 5.
#flowable.mail.server.password=

# Uncomment to divert every outgoing mail to one address regardless of what the model says — useful when
# testing against a real SMTP server with real recipient addresses in the process variables.
#flowable.mail.server.force-to=sharifruet@gmail.com

# rest properties

# Configures the way user credentials are verified when doing a REST API call:
# Whether an unauthenticated request gets a WWW-Authenticate: Basic challenge. Off here
# because this API is consumed by browser apps over XHR, and that header makes the browser
# open its own credential dialog and block the request behind it — in Firefox the request
# then never settles. Set true to restore the prompt for poking at the API by hand.
flowable.rest.app.authentication-challenge=false

# 'any-user' : the user needs to exist and the password need to match. Any user is allowed to do the call (this is the pre 6.3.0 behavior)
# 'verify-privilege' : the user needs to exist, the password needs to match and the user needs to have the 'rest-api' privilege
# If nothing set, defaults to 'verify-privilege'
flowable.rest.app.authentication-mode=verify-privilege

# Enable/disable Java serializable objects to be passed as variables in the REST API.
rest.variables.allow.serializable=true

# Enable/disable whether the docs are available on /docs
flowable.rest.app.swagger-docs-enabled=true

flowable.rest.app.admin.user-id=rest-admin
flowable.rest.app.admin.password=test
flowable.rest.app.admin.firstname=Rest
flowable.rest.app.admin.lastname=Admin


